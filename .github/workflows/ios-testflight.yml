# iPhone'a Mac'siz kurulum: GitHub'ın Mac'i uygulamayı imzalayıp TestFlight'a
# yükler; telefondaki TestFlight uygulaması yeni sürümü kendisi kurar.
# App Store'da YAYIN YOK — yalnız sizin (iç test) kullanımınız.
#
# Bir kerelik hazırlık: ios/README.md → "Mac'siz kurulum (TestFlight)".
# Gizliler (Settings → Secrets and variables → Actions):
#   ASC_KEY_P8                                 App Store Connect API anahtarı (.p8 metni, Team Key, Admin)
#   ASC_KEY_ID, ASC_ISSUER_ID (isteğe bağlı)   yoksa aşağıdaki env'deki değerler (gizli değil:
#                                              .p8 olmadan işe yaramazlar)
#   SUPABASE_URL, SUPABASE_ANON_KEY (isteğe bağlı) yoksa canlı siteden okunur
#   APPLE_TEAM_ID (isteğe bağlı)               yoksa Apple'dan okunur
# Değişkenler (isteğe bağlı): FT_BUNDLE_ID, WEB_URL
name: iOS TestFlight

on:
  push:
    branches: [master, claude/clever-davinci-dm7r4v]
    paths: ['ios/**', '.github/workflows/ios-testflight.yml']
  workflow_dispatch:
  schedule:
    # TestFlight sürümleri 90 gün geçerli: kod değişmese de ayda bir tazelenir
    - cron: '17 4 1 * *'

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FT_BUNDLE_ID: ${{ vars.FT_BUNDLE_ID || 'com.mylifer.fintrack' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID || 'Y7F9B35NG9' }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || '37a1b1f7-275d-4d21-8d52-f9ea2d6a9e78' }}
    steps:
      - name: Hazırlık tamam mı?
        id: ready
        env:
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$P" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::notice::TestFlight atlandı — eksik gizliler:$missing (ios/README.md → Mac'siz kurulum)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Xcode
        if: steps.ready.outputs.ok == 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"
          xcodebuild -version

      - name: Apple hesabı (paket kimlikleri, uygulama kaydı)
        id: asc
        if: steps.ready.outputs.ok == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Not Defteri'nden yapıştırılan metinde \r ve boşluklar olabilir; Xcode bunları kabul etmez
          kid=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          iss=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          echo "::add-mask::$kid"
          echo "ASC_KEY_ID=$kid" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$iss" >> "$GITHUB_ENV"
          key="$RUNNER_TEMP/private_keys/AuthKey_$kid.p8"
          mkdir -p "$(dirname "$key")"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$' > "$key"
          echo "Key ID ${#kid} karakter, Issuer ID ${#iss} karakter; anahtar $(wc -l < "$key" | tr -d ' ') satır"
          head -1 "$key" | grep -q 'BEGIN PRIVATE KEY' || echo "::warning::.p8 metni '-----BEGIN PRIVATE KEY-----' ile başlamıyor"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
          export ASC_KEY_ID="$kid" ASC_ISSUER_ID="$iss"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q 'pyjwt[crypto]'
          ASC_KEY_PATH="$key" "$RUNNER_TEMP/venv/bin/python" ios/scripts/asc.py

      - name: Supabase bilgileri (gizli yoksa canlı siteden)
        id: site
        # Hazırlık eksikken de denenir (siteden okumanın çalıştığını erkenden görmek için)
        continue-on-error: ${{ steps.ready.outputs.ok != 'true' }}
        env:
          U: ${{ secrets.SUPABASE_URL }}
          A: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$U" ] && [ -n "$A" ]; then
            echo "Gizlilerden"; echo "url=$U" >> "$GITHUB_OUTPUT"; echo "key=$A" >> "$GITHUB_OUTPUT"
          else
            python3 ios/scripts/site-keys.py "${{ vars.WEB_URL || 'https://fintrack-os-ten.vercel.app' }}"
          fi

      - name: Ayar dosyaları
        if: steps.ready.outputs.ok == 'true'
        working-directory: ios/Config
        env:
          SUPABASE_URL: ${{ steps.site.outputs.url }}
          SUPABASE_ANON_KEY: ${{ steps.site.outputs.key }}
          TEAM: ${{ secrets.APPLE_TEAM_ID || steps.asc.outputs.team }}
        run: |
          [ -n "$TEAM" ] || { echo "::error::Ekip kimliği bulunamadı: APPLE_TEAM_ID gizlisini ekleyin (developer.apple.com → Membership)."; exit 1; }
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed 's#//#/$()/#')
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          umask 077
          printf 'SUPABASE_URL = %s\nSUPABASE_ANON_KEY = %s\n' "$url" "$key" > Secrets.xcconfig
          printf 'DEVELOPMENT_TEAM = %s\nFT_BUNDLE_ID = %s\n' "$TEAM" "$FT_BUNDLE_ID" > Local.xcconfig
          echo "TEAM=$TEAM" >> "$GITHUB_ENV"

      - name: Arşivle (imzalı)
        if: steps.ready.outputs.ok == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          # Sürüm numarası her yüklemede artmalı
          build=$((GITHUB_RUN_NUMBER + 100))
          xcodebuild -project FinTrack.xcodeproj -scheme FinTrack -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FinTrack.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=$build archive 2>&1 \
            | grep -E "error:|BUILD|ARCHIVE|\*\*|Signing|provision" | head -200

      - name: TestFlight'a yükle
        if: steps.ready.outputs.ok == 'true'
        working-directory: ios
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>testFlightInternalTestingOnly</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FinTrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -60
          echo "::notice::Yüklendi. Apple işlemesi ~10-30 dk sürer; sonra iPhone'daki TestFlight'ta görünür."

      - name: Gizli dosyaları temizle
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys" ios/Config/Secrets.xcconfig ios/Config/Local.xcconfig
