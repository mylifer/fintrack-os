# iOS uygulaması: her ios/ değişikliğinde GitHub'ın Mac makinesinde
#   1) FinTrackKit testleri (swift test)
#   2) uygulama + widget simülatör için derlenir (imzasız)
#   3) örnek veriyle (-demo) ana ekranların görüntüsü alınır → "ekranlar" eki
# Telefona kurulum bundan bağımsızdır (Xcode'dan, ios/README.md).
name: iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode sürümü
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: FinTrackKit testleri
        working-directory: ios/FinTrackKit
        run: swift test 2>&1 | tail -40; exit ${PIPESTATUS[0]}

      - name: Simülatör için derle
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project FinTrack.xcodeproj -scheme FinTrack -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | grep -E "error:|warning: .*(deprecated|will be an error)|BUILD (SUCCEEDED|FAILED)|\*\*" | head -200

      - name: Ekran görüntüleri
        working-directory: ios
        run: |
          set -u
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone 16")]
          print((c or [x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")])[0]["udid"])')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          app=$(ls -d build/Build/Products/Debug-iphonesimulator/FinTrack.app)
          xcrun simctl install "$udid" "$app"
          mkdir -p shots
          shot() { # ad, argümanlar…
            name=$1; shift
            xcrun simctl terminate "$udid" com.mylifer.fintrack 2>/dev/null || true
            xcrun simctl launch "$udid" com.mylifer.fintrack -demo "$@" >/dev/null
            sleep 6
            xcrun simctl io "$udid" screenshot "shots/$name.png" >/dev/null 2>&1 && echo "✓ $name"
          }
          grep -v "^#" scripts/screens.txt | while IFS="|" read -r name args; do
            [ -z "$name" ] && continue
            # shellcheck disable=SC2086
            shot "$name" $args
          done
          xcrun simctl spawn "$udid" log show --last 5m --predicate 'process == "FinTrack"' --style compact 2>/dev/null \
            | grep -iE "fatal|crash|error" | tail -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekranlar
          path: ios/shots/
          if-no-files-found: ignore
          retention-days: 14
