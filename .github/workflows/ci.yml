# Her push ve PR'da tip kontrolü, lint, birim testleri ve üretim derlemesi.
# Vercel deploy'undan bağımsızdır: burası yalnız "bu commit sağlam mı?" sorusunu
# yanıtlar. Adımlardan biri kırılırsa PR'da kırmızı görünür.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Birim testleri
        run: npm test

      # Derleme, useSearchParams/Suspense gibi yalnız build'de patlayan kuralları
      # yakalar. Supabase değişkenleri yalnızca istemci modülünün yüklenebilmesi
      # için sahte değerlerdir — derleme sırasında ağa çıkılmaz.
      - name: Üretim derlemesi
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_TELEMETRY_DISABLED: 1

  # Depodaki SQL projeyi BOŞ bir veritabanında sıfırdan kurabiliyor mu
  # (felaket kurtarma / yeni test projesi)? Supabase 30 Ekim 2026'dan beri
  # yeni tablolara Data API izni vermediği için izni unutulmuş bir tablo da
  # burada kırmızı olur. Supabase'e bağlanmaz — geçici bir Postgres kullanır.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Sıfırdan kurulum + izin/RLS kontrolleri
        run: supabase/fresh-install/run.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

  # Uçtan uca testler (e2e/): uygulama AUTH_BYPASS=1 ile `next dev` üzerinde
  # girişsiz açılır, her test kendi tarayıcı bağlamında (IndexedDB) çalışır.
  # Supabase değişkenleri sahte — buluta hiç yazılmaz.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: npm run test:e2e

      - name: Hata raporu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
