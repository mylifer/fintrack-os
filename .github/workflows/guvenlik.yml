# Bağımlılıklarda bilinen güvenlik açıkları: kilit dosyası değişince ve haftada bir
# (yeni duyurulan açıklar için). Yüksek ya da kritik açık varsa kırmızı olur.
name: Güvenlik

on:
  push:
    branches: [master]
    paths:
      - package-lock.json
      - .github/workflows/guvenlik.yml
  pull_request:
    paths:
      - package-lock.json
      - .github/workflows/guvenlik.yml
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılık taraması (npm audit)
        run: npm audit --audit-level=high
